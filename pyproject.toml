[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "groww-weekly-review-pulse"
version = "0.1.0"
description = "Weekly review pulse for Groww (Stocks, Mutual Fund, IPO) via Google Play reviews and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "google-play-scraper==1.2.7",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
pipeline = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]
dev = [
    "groww-weekly-review-pulse[pipeline]",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]

[tool.vercel]
entrypoint = "src.api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src"]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["google_play_scraper.*", "sklearn.*"]
ignore_missing_imports = true
