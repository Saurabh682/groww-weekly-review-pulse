window:
  weeks: 12                           # min 8, max 12

sources:
  app_store:
    enabled: true                     # Kill switch for Apple RSS collection (COL-02)
  play_store:
    enabled: true                     # Kill switch for Play Store collection (COL-02)

themes:
  max_themes: 5                       # Hard cap: maximum 5 themes
  min_cluster_share: 0.03
  top_n: 3                            # Top 3 themes in weekly note

note:
  max_words: 250                      # Hard cap: maximum 250 words
  quotes: 3                           # Exactly 3 verbatim quotes
  actions: 3                          # Exactly 3 concrete action ideas
  min_reviews: 30                     # Publish nothing below this many usable reviews (COL-08)

llm:
  provider: gemini
  model: gemini-2.5-flash
  temperature: 0.2

email:
  to: "${PULSE_EMAIL_TO}"

mcp:
  config: config/mcp.yaml
