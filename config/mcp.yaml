version: "2.0"
provider: composio

server:
  url_env: COMPOSIO_MCP_URL
  api_key_env: COMPOSIO_API_KEY

accounts:
  googledocs: COMPOSIO_GOOGLEDOCS_ACCOUNT_ID
  gmail: COMPOSIO_GMAIL_ACCOUNT_ID

capabilities:
  docs.create:
    tool: GOOGLEDOCS_CREATE_DOCUMENT_MARKDOWN
    toolkit: googledocs
    description: Create the weekly pulse Doc from Markdown
  docs.get:
    tool: GOOGLEDOCS_GET_DOCUMENT_BY_ID
    toolkit: googledocs
    description: Read the Doc body end index before replacing it
  docs.clear:
    tool: GOOGLEDOCS_UPDATE_EXISTING_DOCUMENT
    toolkit: googledocs
    description: Clear the Doc body with one deleteContentRange
  docs.write:
    tool: GOOGLEDOCS_UPDATE_DOCUMENT_SECTION_MARKDOWN
    toolkit: googledocs
    description: Append the new Markdown into the cleared Doc
  gmail.create_draft:
    tool: GMAIL_CREATE_EMAIL_DRAFT
    toolkit: gmail
    description: Create an unsent draft addressed to the operator
  gmail.update_draft:
    tool: GMAIL_UPDATE_DRAFT
    toolkit: gmail
    description: Update the stored draft for the same app and week

denied_tool_patterns:
  - SEND
  - DELETE
  - TRASH

policy:
  draft_only: true
  allow_send_email: false
  max_retries: 3
  timeout_seconds: 60
  backoff_seconds: 0.5
